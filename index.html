<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Paw Tally</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============== CONFIG WARNING (shows only if Firebase config is missing) ============== -->
<div id="config-warning-wrap" class="hidden" style="max-width:480px;margin:40px auto;padding:0 18px;">
  <div id="config-warning">
    <strong>Setup needed:</strong> Add your Firebase project config in <code>firebase-config.js</code>. See the README that came with this file for step-by-step instructions.
  </div>
</div>

<!-- ============== MAIN APP ============== -->
<div id="app" class="hidden">
  <header>
    <div class="brand">
      <span class="paw">🐾</span>
      <h1 class="display">Paw Tally</h1>
    </div>
  </header>

  <div class="card">
    <div class="category-row">
      <span class="group-label">Logging</span>
      <div class="toggle-pair" id="category-toggle">
        <button type="button" data-val="Service" class="active">Service</button>
        <button type="button" data-val="Expense">Expense</button>
      </div>
    </div>

    <div id="service-fields">
      <div class="field" style="margin-bottom:0;">
        <label for="customer-name">Customer</label>
        <input type="text" id="customer-name" placeholder="e.g. Sirikit (Milo's owner)" autocomplete="off">
      </div>

      <div class="group-row">
        <div class="group">
          <span class="group-label">When</span>
          <div class="toggle-pair" id="type-toggle">
            <button type="button" data-val="Booking" class="active">Booking</button>
            <button type="button" data-val="After Service">After Service</button>
          </div>
        </div>
        <div class="group">
          <span class="group-label">Service</span>
          <div class="toggle-pair" id="service-toggle">
            <button type="button" data-val="Boarding" class="active">Boarding</button>
            <button type="button" data-val="Grooming">Grooming</button>
          </div>
        </div>
      </div>
    </div>

    <div class="field amount-row">
      <label for="amount" id="amount-label">Amount (optional)</label>
      <input type="number" id="amount" inputmode="decimal" placeholder="0.00" step="0.01" min="0">
    </div>

    <div class="field hidden" id="notes-row">
      <label for="notes">Notes</label>
      <textarea id="notes" placeholder="What was this expense for?" rows="2"></textarea>
    </div>

    <button class="btn btn-primary" id="add-btn">Add to today's log</button>
  </div>

  <div class="list-header">
    <h2>Not yet in ledger</h2>
    <button class="clear-all" id="clear-all-btn">Clear all</button>
  </div>

  <div id="entries"></div>
  <div id="empty-state">
    <span class="paw">🐾</span>
    <p>Nothing logged yet.<br>Entries you add will stack up here until you clear them.</p>
  </div>
</div>

<div id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
